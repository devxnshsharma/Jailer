<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b11" />
    <meta name="description" content="Mass Metro: a dependency-free raw WebGL browser action game with the native demo's inventory and third-person direction." />
    <title>Mass Metro — Native Demo 3D Web Runtime</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main id="game" class="game-shell">
      <canvas id="world" aria-label="Mass Metro game canvas"></canvas>

      <section class="hud" aria-live="polite">
        <header class="hud-header">
          <div class="brand"><b>MM</b><span>SHADOW OF MUTHU NAGAR</span></div>
          <div class="scoreline"><span>SCORE</span><strong data-score>000000</strong><span>CRED</span><strong data-cred>000</strong></div>
        </header>

        <aside class="mission-panel">
          <span class="eyebrow">ACTIVE SCENARIO</span>
          <strong data-mission-title>NEON BAZAAR</strong>
          <span data-mission-objective>Clear the temple-market Black Lotus squad</span>
          <b data-mission-progress>0 / 5</b>
        </aside>

        <aside class="armory-panel">
          <div class="armory-kicker">NATIVE INVENTORY / <b data-weapon-short>45</b></div>
          <strong data-weapon-name>COLT .45</strong>
          <div class="ammo"><b data-ammo>12</b><span>/</span><span data-reserve>072</span></div>
          <div class="reload-track"><i data-reload></i></div>
          <div class="weapon-grid" data-weapon-grid></div>
          <small>Z → ] EQUIP · TAB CYCLE · R RELOAD · CLICK / L FIRE</small>
        </aside>

        <section class="status-panel">
          <div><span>VETRI</span><b data-health-label>100 / 100</b></div>
          <div class="meter"><span>AURA METER</span><b data-meter-label>38%</b></div>
          <i class="bar health"><em data-health></em></i>
          <i class="bar aura"><em data-meter></em></i>
        </section>

        <nav class="ability-panel" aria-label="Abilities">
          <button data-ability="massEntry"><b>1</b><span>MASS ENTRY</span></button>
          <button data-ability="auraStrike"><b>2</b><span>AURA STRIKE</span></button>
          <button data-ability="timeVeil"><b>3</b><span>TIME VEIL</span></button>
          <button data-ability="finalBell"><b>4</b><span>FINAL BELL</span></button>
        </nav>

        <div class="toast" data-toast></div>
      </section>

      <section class="screen is-visible" data-screen>
        <div class="screen-card" data-screen-card></div>
      </section>
    </main>
    <script type="module" src="/web/game.js"></script>
  </body>
</html>
